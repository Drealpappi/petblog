<button
    class="like-btn {% if liked %}liked{% endif %}"
    hx-post="{% url 'toggle_like' post.id %}"
    hx-target="#like-btn-{{ post.id }}"
    hx-swap="innerHTML"
    data-login-url="{% url 'login' %}?next={{ request.path }}"
    data-authenticated="{{ request.user.is_authenticated|yesno:'true,false' }}"
    onclick="handleLikeClick(this)"
>
    <i class="ti ti-heart" aria-hidden="true"></i>
    <span class="like-count">{{ like_count }}</span>
</button>
